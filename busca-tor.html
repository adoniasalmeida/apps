<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buscador Torbox</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.08);
    --accent: #7c5cff;
    --accent2: #22d3ee;
    --text: #e8e8ee;
    --muted: #9a9aab;
    --green: #34d399;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #14151f 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    padding: 24px 16px 12px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .config {
    max-width: 560px;
    margin: 0 auto 8px;
    padding: 0 16px;
  }
  .config input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 12px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    max-width: 560px;
    margin: 12px auto;
    padding: 0 16px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
  }
  .tab.active {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b0d12;
    font-weight: 600;
  }

  .search-bar {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 8px;
  }
  .search-bar input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
  }
  .search-bar button {
    padding: 0 18px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b0d12;
    font-weight: 700;
    cursor: pointer;
  }

  .results, .os-list {
    max-width: 560px;
    margin: 16px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .result-card {
    display: flex;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 10px;
    cursor: pointer;
  }
  .result-card img {
    width: 56px;
    height: 84px;
    object-fit: cover;
    border-radius: 8px;
    background: #1a1c25;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-info .title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .result-info .meta { font-size: 12px; color: var(--muted); }

  .panel {
    max-width: 560px;
    margin: 16px auto 0;
    padding: 0 16px;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .panel-header h2 { font-size: 15px; margin: 0; }
  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
  }

  .torrent-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .torrent-item .t-name { font-size: 13px; margin-bottom: 6px; word-break: break-word; }
  .torrent-item .t-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
  }
  .badge.cached { background: rgba(52,211,153,0.15); color: var(--green); }
  .badge.notcached { background: rgba(248,113,113,0.15); color: var(--red); }

  .btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .status-msg {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
  }

  .os-item {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .os-item .os-name { font-size: 13px; font-weight: 600; }
  .os-item .os-cat { font-size: 11px; color: var(--muted); }

  a.dl-link {
    color: var(--accent2);
    font-size: 12px;
    word-break: break-all;
  }
</style>
</head>
<body>

<header>
  <h1>🔎 Buscador Torbox</h1>
  <p>TMDB + cache do Torbox, num lugar só</p>
</header>

<div class="config">
  <input id="workerUrl" placeholder="URL do seu Worker (ex: https://torbox-search.SEUUSUARIO.workers.dev)" />
</div>

<div class="tabs">
  <div class="tab active" data-tab="filmes">🎬 Filmes/Séries</div>
  <div class="tab" data-tab="livre">📦 Software Livre</div>
</div>

<div id="tab-filmes">
  <div class="search-bar">
    <input id="searchInput" placeholder="Buscar filme ou série..." />
    <button onclick="buscarTmdb()">Ir</button>
  </div>
  <div class="results" id="results"></div>
  <div class="panel" id="torrentPanel" style="display:none;">
    <div class="panel-header">
      <h2 id="panelTitle"></h2>
      <button class="close-btn" onclick="fecharPainel()">×</button>
    </div>
    <div id="torrentList"></div>
  </div>
</div>

<div id="tab-livre" style="display:none;">
  <div class="os-list" id="osList"></div>
</div>

<script>
function workerUrl() {
  const v = document.getElementById('workerUrl').value.trim().replace(/\/$/, '');
  if (v) localStorage.setItem('torbox_worker_url', v);
  return v;
}
document.getElementById('workerUrl').value = localStorage.getItem('torbox_worker_url') || '';

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('tab-filmes').style.display = target === 'filmes' ? 'block' : 'none';
    document.getElementById('tab-livre').style.display = target === 'livre' ? 'block' : 'none';
    if (target === 'livre') carregarSoftwareLivre();
  });
});

async function buscarTmdb() {
  const url = workerUrl();
  const query = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('results');
  if (!url) { resultsEl.innerHTML = '<div class="status-msg">Preencha a URL do Worker acima.</div>'; return; }
  if (!query) return;
  resultsEl.innerHTML = '<div class="status-msg">Buscando...</div>';
  try {
    const res = await fetch(`${url}/tmdb/search?query=${encodeURIComponent(query)}&type=multi`);
    const data = await res.json();
    const items = (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv');
    if (!items.length) { resultsEl.innerHTML = '<div class="status-msg">Nada encontrado.</div>'; return; }
    resultsEl.innerHTML = items.map(item => {
      const titulo = item.title || item.name;
      const ano = (item.release_date || item.first_air_date || '').slice(0, 4);
      const poster = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';
      return `<div class="result-card" onclick="abrirTorrents(${item.id}, '${item.media_type}', '${titulo.replace(/'/g, "\\'")}')">
        <img src="${poster}" onerror="this.style.opacity=0" />
        <div class="result-info">
          <div class="title">${titulo}</div>
          <div class="meta">${item.media_type === 'movie' ? 'Filme' : 'Série'} · ${ano || '—'}</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    resultsEl.innerHTML = `<div class="status-msg">Erro: ${e}</div>`;
  }
}

async function abrirTorrents(tmdbId, type, titulo) {
  const url = workerUrl();
  const panel = document.getElementById('torrentPanel');
  const list = document.getElementById('torrentList');
  document.getElementById('panelTitle').textContent = titulo;
  panel.style.display = 'block';
  list.innerHTML = '<div class="status-msg">Consultando Torbox...</div>';
  panel.scrollIntoView({ behavior: 'smooth' });
  try {
    const res = await fetch(`${url}/torbox/search?tmdb_id=${tmdbId}&type=${type === 'tv' ? 'tv' : 'movie'}&cached_only=false`);
    const data = await res.json();
    const torrents = data.torrents || [];
    if (!torrents.length) {
      list.innerHTML = '<div class="status-msg">Nenhum torrent encontrado para este título ainda.</div>';
      return;
    }
    torrents.sort((a, b) => (b.cached === true) - (a.cached === true));
    list.innerHTML = torrents.map((t, i) => {
      const nome = t.raw_title || t.title || t.name || 'sem título';
      const tamanho = t.size ? `${(t.size / 1e9).toFixed(2)} GB` : '';
      const cached = t.cached === true;
      const seeders = t.last_known_seeders != null ? `${t.last_known_seeders} seeds` : '';
      const magnet = t.magnet || '';
      window.__magnets = window.__magnets || {};
      window.__magnets[i] = magnet;
      return `<div class="torrent-item">
        <div class="t-name">${nome}</div>
        <div class="t-meta">
          ${tamanho ? `<span class="badge">${tamanho}</span>` : ''}
          ${seeders ? `<span class="badge">${seeders}</span>` : ''}
          <span class="badge ${cached ? 'cached' : 'notcached'}">${cached ? '✓ em cache' : 'sem cache'}</span>
        </div>
        <button class="btn" onclick="adicionarTorrent(window.__magnets[${i}], this)" ${magnet ? '' : 'disabled'}>Adicionar e baixar</button>
        <div class="dl-area" id="dl-${i}"></div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="status-msg">Erro: ${e}</div>`;
  }
}

async function adicionarTorrent(magnet, btnEl) {
  const url = workerUrl();
  if (!magnet) { alert('Sem magnet disponível para este item.'); return; }
  btnEl.disabled = true;
  btnEl.textContent = 'Adicionando...';
  try {
    const res = await fetch(`${url}/torbox/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet }),
    });
    const data = await res.json();
    const torrentId = data.data && data.data.torrent_id;
    if (!torrentId) { btnEl.textContent = 'Erro ao adicionar'; return; }
    const dlRes = await fetch(`${url}/torbox/dl?torrent_id=${torrentId}`);
    const dlData = await dlRes.json();
    const link = dlData.data;
    btnEl.style.display = 'none';
    btnEl.insertAdjacentHTML('afterend', `<a class="dl-link" href="${link}" target="_blank">${link || 'processando, tente checar novamente em instantes'}</a>`);
  } catch (e) {
    btnEl.textContent = 'Erro: ' + e;
  }
}

function fecharPainel() {
  document.getElementById('torrentPanel').style.display = 'none';
}

async function carregarSoftwareLivre() {
  const url = workerUrl();
  const list = document.getElementById('osList');
  if (!url) { list.innerHTML = '<div class="status-msg">Preencha a URL do Worker acima.</div>'; return; }
  list.innerHTML = '<div class="status-msg">Carregando...</div>';
  try {
    const res = await fetch(`${url}/torbox/os-list`);
    const data = await res.json();
    list.innerHTML = data.items.map((item, i) => `
      <div class="os-item">
        <div>
          <div class="os-name">${item.nome}</div>
          <div class="os-cat">${item.categoria}</div>
        </div>
        <button class="btn secondary" onclick="baixarSoftware('${item.magnet.replace(/'/g, "\\'")}', this)">Baixar</button>
      </div>
    `).join('');
  } catch (e) {
    list.innerHTML = `<div class="status-msg">Erro: ${e}</div>`;
  }
}

async function baixarSoftware(magnet, btnEl) {
  const url = workerUrl();
  btnEl.disabled = true;
  btnEl.textContent = '...';
  try {
    const res = await fetch(`${url}/torbox/add`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet }),
    });
    const data = await res.json();
    const torrentId = data.data && data.data.torrent_id;
    if (!torrentId) { btnEl.textContent = 'erro'; return; }
    const dlRes = await fetch(`${url}/torbox/dl?torrent_id=${torrentId}`);
    const dlData = await dlRes.json();
    btnEl.outerHTML = `<a class="dl-link" href="${dlData.data}" target="_blank">baixar</a>`;
  } catch (e) {
    btnEl.textContent = 'erro';
  }
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarTmdb();
});
</script>

</body>
</html>
