<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>TorrentBox — Buscador de torrents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --panel:#111119; --panel2:#1a1a25;
  --line:#1f1f2e;
  --text:#e4e4ed; --muted:#9898b0;
  --cyan:#06b6d4; --cyan-hover:#22d3ee; --purple:#7c3aed;
  --green:#10b981; --yellow:#f59e0b; --danger:#ef4444;
  --max:720px;
  --r-sm:.25rem; --r-md:.375rem; --r-lg:.5rem; --r-xl:.75rem; --r-2xl:1rem; --r-3xl:1.5rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--text);
  background:radial-gradient(circle at 50% -10%,rgba(0,200,255,.12),transparent 32%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.container{width:min(var(--max),calc(100% - 32px));margin:auto}
.topbar{height:3px;background:linear-gradient(90deg,transparent,var(--cyan),var(--green),transparent)}

header{position:sticky;top:0;z-index:20;backdrop-filter:blur(18px);background:rgba(7,10,15,.72);border-bottom:1px solid rgba(255,255,255,.055)}
.nav{height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;font-size:16px;font-family:'Space Grotesk',Inter,sans-serif}
.brand-mark{width:28px;height:28px;border-radius:var(--r-lg);display:grid;place-items:center;background:linear-gradient(145deg,var(--cyan-hover),var(--purple));box-shadow:0 0 18px var(--cyan-hover);opacity:.95;font-size:14px}
.gear-btn{width:34px;height:34px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gear-btn:hover{border-color:var(--cyan-hover);color:#fff}

.hero{position:relative;text-align:center;padding:60px 0 20px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);border-radius:999px;background:color-mix(in srgb,var(--cyan) 8%,transparent);color:var(--cyan-hover);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green)}
h1{max-width:520px;margin:16px auto 22px;font-size:clamp(26px,6vw,38px);line-height:1.08;letter-spacing:-.03em;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700}
.accent{color:var(--cyan-hover);text-shadow:0 0 24px color-mix(in srgb,var(--cyan) 40%,transparent)}

.search-wrap{position:relative;max-width:560px;margin:auto}
.search{padding:6px;display:flex;gap:6px;border:1px solid var(--line);border-radius:var(--r-2xl);background:color-mix(in srgb,var(--panel) 92%,black);box-shadow:0 20px 60px rgba(0,0,0,.28)}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:11px 12px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search button{padding:11px 18px;border:0;border-radius:var(--r-xl);background:var(--cyan);color:#031016;font-weight:800;cursor:pointer}
.search button:hover{background:var(--cyan-hover)}

.chips{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:560px;margin:16px auto 0}
.chips-label{font-size:11px;color:var(--muted);margin-right:2px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer}
.chip:hover{border-color:var(--cyan);color:var(--cyan-hover)}

#resultados{padding:8px 0 40px}
.result-list{display:flex;flex-direction:column;gap:2px}
.result-row{display:flex;align-items:center;gap:14px;padding:11px 8px;border-radius:var(--r-xl);cursor:pointer}
.result-row:hover{background:var(--panel)}
.result-thumb{width:46px;height:66px;border-radius:var(--r-md);object-fit:cover;background:var(--panel2);flex-shrink:0}
.result-thumb-fallback{width:46px;height:66px;border-radius:var(--r-md);background:var(--panel2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);text-align:center;padding:2px}
.result-info{min-width:0;flex:1}
.result-info .rt{font-size:14px;font-weight:700}
.result-info .rm{font-size:12px;color:var(--muted);margin-top:2px}
.result-info .rm b{color:var(--yellow);font-weight:700}
.result-arrow{color:var(--muted);font-size:14px;flex-shrink:0}

footer{border-top:1px solid var(--line);padding:24px 0;color:#657181;font-size:11px;text-align:center;margin-top:60px}

/* ---- popup (estilo CineStream) ---- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(4,6,10,.72);display:none;z-index:40}
.sheet-backdrop.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:auto;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:var(--r-3xl) var(--r-3xl) 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:41}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--panel2);border-radius:var(--r-sm);margin:10px auto;flex-shrink:0}
.sheet-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:19px;cursor:pointer;line-height:1;z-index:2}
.sheet-body{overflow-y:auto}

.detail-row{display:flex;gap:14px;padding:20px 18px 0}
.detail-poster{width:88px;border-radius:var(--r-lg);flex-shrink:0;box-shadow:0 12px 26px rgba(0,0,0,.4);background:var(--panel2)}
.detail-info{min-width:0}
.detail-info h2{font-size:17px;margin:0 0 3px;font-weight:800;line-height:1.25;font-family:'Space Grotesk',Inter,sans-serif}
.detail-info .yr{font-size:12px;color:var(--muted);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.rating{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 30%,transparent)}
.tag.type{color:var(--cyan-hover);border-color:color-mix(in srgb,var(--cyan) 30%,transparent)}
.sec-title{padding:18px 18px 8px;font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.se-row{display:flex;align-items:center;gap:8px;padding:0 18px 12px}
.se-row label{font-size:11px;color:var(--muted)}
.se-row input{width:50px;padding:7px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;text-align:center}
.se-row button{padding:7px 14px;border-radius:var(--r-lg);border:none;background:var(--cyan);color:#031016;font-weight:800;font-size:12.5px;cursor:pointer}

.filter-row{display:flex;gap:8px;padding:0 18px 12px;flex-wrap:wrap}
.filter-row select{
  flex:1;min-width:120px;padding:8px 10px;border-radius:var(--r-lg);
  border:1px solid var(--line);background:var(--panel2);color:var(--text);
  font-size:12px;font-family:inherit;
}

.stream-list{padding:0 18px 26px}
.qgroup-head{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qtag{font-size:10px;padding:2px 7px;border-radius:var(--r-sm);font-weight:900}
.qtag.q4k{background:color-mix(in srgb,var(--purple) 18%,transparent);color:#a78bfa}
.qtag.q1080{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.qtag.q720{background:color-mix(in srgb,var(--yellow) 18%,transparent);color:var(--yellow)}
.qtag.qsd{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}

.stream-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stream-row:last-child{border-bottom:none}
.stream-main{min-width:0;flex:1}
.meta-pills{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:4px}
.mp{font-size:9.5px;padding:2px 6px;border-radius:var(--r-sm);font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.mp.flags{background:none;border:none;padding:0;font-size:12px}
.mp.cached{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.mp.peers{background:color-mix(in srgb,var(--yellow) 14%,transparent);color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 25%,transparent)}
.mp.src{background:color-mix(in srgb,var(--purple) 14%,transparent);color:#a78bfa;border-color:color-mix(in srgb,var(--purple) 25%,transparent)}
.stream-name{font-size:11.5px;color:var(--text);line-height:1.35;word-break:break-word}

.icon-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;position:relative}
.icon-btn{width:32px;height:32px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.dl{background:var(--cyan);color:#031016;border-color:transparent}
.icon-btn.dl:hover{background:var(--cyan-hover)}

.status-msg{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;white-space:pre-wrap;line-height:1.6}

/* ---- modal config ---- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,6,10,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-2xl);width:100%;max-width:380px;padding:20px}
.modal h2{font-size:16px;margin:0 0 4px;font-family:'Space Grotesk',Inter,sans-serif}
.modal .sub{font-size:11.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input{width:100%;padding:10px 12px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px;font-family:inherit}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:10px;border-radius:var(--r-lg);border:none;font-size:13px;font-weight:700;cursor:pointer}
.modal-actions .save{background:var(--cyan);color:#031016}
.modal-actions .save:hover{background:var(--cyan-hover)}
.modal-actions .cancel{background:var(--panel2);color:var(--muted)}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--panel2);border:1px solid color-mix(in srgb,var(--cyan) 30%,transparent);color:var(--text);padding:10px 16px;border-radius:var(--r-lg);font-size:12px;transition:.22s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="topbar"></div>

<header>
  <div class="container nav">
    <a class="brand" href="#"><div class="brand-mark">⚡</div> TorrentBox</a>
    <button class="gear-btn" onclick="abrirConfig()">⚙</button>
  </div>
</header>

<section class="hero">
  <div class="container">
    <div class="badge"><i class="dot"></i> Busca + cache do Torbox</div>
    <h1>Encontre qualquer <span class="accent">torrent.</span> Sem surpresas.</h1>
    <div class="search-wrap">
      <form class="search" id="searchForm" onsubmit="event.preventDefault();">
        <input id="searchInput" autocomplete="off" placeholder="Digite o nome do filme ou série..." />
        <button type="submit">Buscar</button>
      </form>
    </div>
    <div class="chips" id="chips">
      <span class="chips-label">Experimente</span>
    </div>
  </div>
</section>

<section class="container" id="resultados" style="display:none;">
  <div class="result-list" id="resultList"></div>
</section>

<footer><div class="container">TorrentBox — busca pessoal, sem conta, sem anúncio.</div></footer>

<!-- popup de detalhe -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="fecharSheet()"></div>
<div class="sheet" id="sheet">
  <button class="sheet-close" onclick="fecharSheet()">×</button>
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <div class="detail-row">
      <img class="detail-poster" id="detailPoster" src="" />
      <div class="detail-info">
        <h2 id="detailTitle"></h2>
        <div class="yr" id="detailYear"></div>
        <div class="tags" id="detailTags"></div>
      </div>
    </div>

    <div class="sec-title">Torrents encontrados</div>
    <div class="se-row" id="seRow" style="display:none;">
      <label>Temp.</label><input id="seasonInput" type="number" min="1" value="1" />
      <label>Ep.</label><input id="episodeInput" type="number" min="1" value="1" />
      <button onclick="buscarStreams()">Buscar</button>
    </div>
    <div class="filter-row" id="filterRow" style="display:none;">
      <select id="filtroIdioma" onchange="renderStreamList()"></select>
      <select id="filtroQualidade" onchange="renderStreamList()"></select>
    </div>
    <div class="stream-list" id="streamList"></div>
  </div>
</div>

<!-- modal config -->
<div class="modal-backdrop" id="configBackdrop" onclick="if(event.target===this) fecharConfig()">
  <div class="modal">
    <h2>Suas chaves de API</h2>
    <p class="sub">Ficam salvas só neste navegador (localStorage). Nunca são enviadas a mim ou a terceiros.</p>
    <div class="field"><label>TMDB API Key</label><input id="tmdbKey" placeholder="Chave da API TMDB (v3)" /></div>
    <div class="field"><label>Torbox API Key</label><input id="torboxKey" placeholder="Chave da API Torbox" /></div>
    <div class="modal-actions">
      <button class="cancel" onclick="fecharConfig()">Fechar</button>
      <button class="save" onclick="salvarConfig()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TMDB_BASE = 'https://api.themoviedb.org/3';
const AIOSTREAMS_BASE = 'https://aiostreams.elfhosted.com/stremio/c9422674-8013-47ba-bc0b-e3d7b5bf6f7e/eyJpIjoiS2pubmR3MEdaUTNOeklySWdBdzlIQT09IiwiZSI6IkxKR1EwMUtXZmhQcHpITWh5NnJ5SFE9PSIsInQiOiJhIn0';
const ICON_COPY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_DOWNLOAD = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

const SUGESTOES_POOL = [
  'Matrix', 'Breaking Bad', 'Interestelar', 'The Boys', 'Duna',
  'Round 6', 'Vingadores', 'Round 6', 'Cidade de Deus', 'Chernobyl',
  'O Poderoso Chefão', 'Peaky Blinders', 'Coringa', 'Stranger Things',
  'A Origem', 'Tropa de Elite', 'Round 6', 'Better Call Saul', 'Oppenheimer'
];
function sortearSugestoes(){
  const pool = [...new Set(SUGESTOES_POOL)];
  const escolhidas = pool.sort(() => Math.random() - 0.5).slice(0, 5);
  const label = document.querySelector('.chips-label');
  document.querySelectorAll('.chip').forEach(c => c.remove());
  escolhidas.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = t;
    btn.onclick = () => buscaRapida(t);
    label.insertAdjacentElement('afterend', btn);
  });
}

let currentImdb = null, currentType = null;
let debounceTimer = null;

function tmdbKey(){ return localStorage.getItem('tmdb_key') || ''; }
function torboxKey(){ return localStorage.getItem('torbox_key') || ''; }

function abrirConfig(){
  document.getElementById('tmdbKey').value = tmdbKey();
  document.getElementById('torboxKey').value = torboxKey();
  document.getElementById('configBackdrop').classList.add('open');
}
function fecharConfig(){ document.getElementById('configBackdrop').classList.remove('open'); }
function salvarConfig(){
  localStorage.setItem('tmdb_key', document.getElementById('tmdbKey').value.trim());
  localStorage.setItem('torbox_key', document.getElementById('torboxKey').value.trim());
  fecharConfig();
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toast);
  window.__toast = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- busca: resultados na página ---------- */
const searchInput = document.getElementById('searchInput');
const chipsEl = document.getElementById('chips');
const resultsSection = document.getElementById('resultados');
const resultListEl = document.getElementById('resultList');

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) {
    resultsSection.style.display = 'none';
    chipsEl.style.display = 'flex';
    return;
  }
  debounceTimer = setTimeout(() => buscarResultados(q), 350);
});

function buscaRapida(termo){
  searchInput.value = termo;
  buscarResultados(termo);
}

function normalizar(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function relevancia(titulo, query){
  const t = normalizar(titulo), q = normalizar(query);
  if (t === q) return 4;
  if (t.startsWith(q)) return 3;
  if (t.includes(` ${q}`) || t.includes(`${q} `)) return 2;
  if (t.includes(q)) return 1;
  return 0;
}

async function buscarResultados(query){
  const key = tmdbKey();
  chipsEl.style.display = 'none';
  resultsSection.style.display = 'block';
  if (!key) { resultListEl.innerHTML = '<div class="status-msg">Abra as configurações (⚙) e preencha sua chave TMDB.</div>'; return; }
  resultListEl.innerHTML = '<div class="status-msg">Buscando...</div>';
  try{
    const res = await fetch(`${TMDB_BASE}/search/multi?api_key=${key}&language=pt-BR&query=${encodeURIComponent(query)}`);
    const data = await res.json();
    let items = (data.results || []).filter(r => r.media_type==='movie' || r.media_type==='tv');
    if (!items.length){ resultListEl.innerHTML = '<div class="status-msg">Nada encontrado.</div>'; return; }
    items = items
      .map(item => ({ item, score: relevancia(item.title || item.name, query) }))
      .sort((a, b) => b.score - a.score || (b.item.popularity||0) - (a.item.popularity||0))
      .map(x => x.item);
    resultListEl.innerHTML = items.map(item => {
      const titulo = item.title || item.name;
      const ano = (item.release_date || item.first_air_date || '').slice(0,4);
      const nota = item.vote_average ? item.vote_average.toFixed(1) : null;
      const thumb = item.poster_path ? `https://image.tmdb.org/t/p/w92${item.poster_path}` : '';
      const img = thumb ? `<img class="result-thumb" src="${thumb}" />` : `<div class="result-thumb-fallback">${titulo}</div>`;
      return `<div class="result-row" onclick='abrirDetalhe(${item.id}, "${item.media_type}")'>
        ${img}
        <div class="result-info">
          <div class="rt">${titulo}</div>
          <div class="rm">${ano || '—'} · ${item.media_type==='movie'?'Filme':'Série'}${nota ? ` · <b>★ ${nota}</b>` : ''}</div>
        </div>
        <span class="result-arrow">›</span>
      </div>`;
    }).join('');
  }catch(e){ resultListEl.innerHTML = `<div class="status-msg">Erro: ${e}</div>`; }
}

/* ---------- popup de detalhe ---------- */
function abrirSheetUI(){
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function fecharSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}

async function abrirDetalhe(tmdbId, tmdbType){
  const tKey = tmdbKey();
  const extType = tmdbType === 'tv' ? 'tv' : 'movie';
  document.getElementById('detailTitle').textContent = 'Carregando...';
  document.getElementById('detailYear').textContent = '';
  document.getElementById('detailTags').innerHTML = '';
  document.getElementById('detailPoster').src = '';
  document.getElementById('streamList').innerHTML = '';
  document.getElementById('seRow').style.display = 'none';
  abrirSheetUI();

  try{
    const res = await fetch(`${TMDB_BASE}/${extType}/${tmdbId}?api_key=${tKey}&language=pt-BR&append_to_response=external_ids`);
    const d = await res.json();
    const titulo = d.title || d.name;
    const ano = (d.release_date || d.first_air_date || '').slice(0,4);
    document.getElementById('detailTitle').textContent = titulo;
    document.getElementById('detailYear').textContent = ano;
    if (d.poster_path) document.getElementById('detailPoster').src = `https://image.tmdb.org/t/p/w200${d.poster_path}`;

    const tags = [];
    tags.push(`<span class="tag type">${extType==='movie'?'Filme':'Série'}</span>`);
    if (d.vote_average) tags.push(`<span class="tag rating">★ ${d.vote_average.toFixed(1)}</span>`);
    (d.genres||[]).slice(0,3).forEach(g => tags.push(`<span class="tag">${g.name}</span>`));
    document.getElementById('detailTags').innerHTML = tags.join('');

    const imdbId = d.external_ids && d.external_ids.imdb_id;
    const list = document.getElementById('streamList');
    if (!imdbId){ list.innerHTML = '<div class="status-msg">IMDb ID não encontrado para este título.</div>'; return; }
    currentImdb = imdbId;
    currentType = extType === 'tv' ? 'series' : 'movie';
    document.getElementById('seRow').style.display = currentType === 'series' ? 'flex' : 'none';
    buscarStreams();
  }catch(e){
    document.getElementById('streamList').innerHTML = `<div class="status-msg">Erro: ${e}</div>`;
  }
}

function parseAioStream(s){
  const name = s.name || '';
  const desc = s.description || '';
  const cached = name.includes('⚡');
  const provider = (name.replace(/\[.*?\]/, '').replace(/\d{3,4}p/i, '').trim()) || null;
  const sizeBytes = (s.behaviorHints && (s.behaviorHints.videoSize || s.behaviorHints.folderSize)) || null;
  const sizeGB = sizeBytes ? (sizeBytes/1e9).toFixed(sizeBytes/1e9 >= 100 ? 0 : 1) + ' GB' : null;
  const fonte = (desc.match(/🎥\s*([^\n🎞🏷]+)/) || [])[1]?.trim() || null;
  const codec = (desc.match(/🎞[^\s]*\s*([^\n🏷]+)/) || [])[1]?.trim() || null;
  const grupo = (desc.match(/🏷[^\s]*\s*([^\n]+)/) || [])[1]?.trim() || null;
  const hdr = (desc.match(/📺\s*([^\n🎧🔊]+)/) || [])[1]?.trim() || null;
  const audio = (desc.match(/🎧\s*([^\n🔊]+)/) || [])[1]?.trim() || null;
  const canais = (desc.match(/🔊\s*([^\n]+)/) || [])[1]?.trim() || null;
  const idioma = (desc.match(/🌎\s*([^\n]+)/) || [])[1]?.trim() || null;
  const filename = (s.behaviorHints && s.behaviorHints.filename) || (desc.match(/📁\s*([^\n]+)/) || [])[1] || name;
  return { provider, cached, sizeGB, fonte, codec, grupo, hdr, audio, canais, idioma, filename };
}
function parseQuality(nome){
  if (/2160p|4k/i.test(nome)) return '4K';
  if (/1080p/i.test(nome)) return '1080p';
  if (/720p/i.test(nome)) return '720p';
  if (/480p|\bsd\b/i.test(nome)) return 'SD';
  return 'Outros';
}
function qClass(q){ return { '4K':'q4k','1080p':'q1080','720p':'q720','SD':'qsd','Outros':'qsd' }[q] || 'qsd'; }

async function buscarStreams(){
  const list = document.getElementById('streamList');
  const filterRow = document.getElementById('filterRow');
  if (!currentImdb) return;
  filterRow.style.display = 'none';
  list.innerHTML = '<div class="status-msg">Buscando torrents...</div>';
  const idPart = currentType === 'series'
    ? `${currentImdb}:${document.getElementById('seasonInput').value||1}:${document.getElementById('episodeInput').value||1}`
    : currentImdb;

  const url = `${AIOSTREAMS_BASE}/stream/${currentType}/${idPart}.json`;

  async function buscarFonte(tentativa){
    try{
      const r = await fetch(url);
      if (r.status === 429){
        if (!tentativa){
          await new Promise(res => setTimeout(res, 1500));
          return buscarFonte(1);
        }
        return { streams: [], erro: 'limite de requisições atingido (429), tente buscar de novo em alguns segundos' };
      }
      const raw = await r.text();
      try { return { streams: (JSON.parse(raw).streams || []) }; }
      catch { return { streams: [], erro: `resposta não-JSON (status ${r.status})` }; }
    }catch(e){
      return { streams: [], erro: `falha de rede: ${e}` };
    }
  }

  try{
    const resposta = await buscarFonte(0);
    const streams = resposta.streams;

    if (!streams.length){ list.innerHTML = `<div class="status-msg">Nenhum torrent encontrado para este título/episódio.${resposta.erro ? `\n\n${resposta.erro}` : ''}</div>`; return; }

    window.__streamsMeta = streams.map(s => ({
      s, meta: parseAioStream(s), quality: parseQuality(s.name || '')
    }));

    montarFiltros();
    renderStreamList();
  }catch(e){ list.innerHTML = `<div class="status-msg">Erro: ${e}</div>`; }
}

function idiomaTokens(idioma){
  if (!idioma) return [];
  return idioma.split(/[,/|]+|\se\s/)
    .map(s => s
      .replace(/\([^)]*\)/g, '')
      .replace(/\b(brasileiro|brasil|br|latino|latam)\b/gi, '')
      .replace(/-\s*(br|pt|us|uk)\b/gi, '')
      .replace(/\s+/g, ' ')
      .trim()
    )
    .filter(Boolean);
}

function montarFiltros(){
  const dados = window.__streamsMeta || [];
  const idiomaSel = document.getElementById('filtroIdioma');
  const qualSel = document.getElementById('filtroQualidade');
  const idiomaAtual = idiomaSel.value;
  const qualAtual = qualSel.value;

  const todosTokens = dados.flatMap(d => idiomaTokens(d.meta.idioma));
  const idiomaMap = new Map();
  todosTokens.forEach(t => { const k = t.toLowerCase(); if (!idiomaMap.has(k)) idiomaMap.set(k, t); });
  const idiomas = [...idiomaMap.values()].sort();
  const temSemIdioma = dados.some(d => !d.meta.idioma);
  idiomaSel.innerHTML = '<option value="">Idioma: todos</option>' +
    idiomas.map(i => `<option value="${i}">${i}</option>`).join('') +
    (temSemIdioma ? '<option value="__none__">Sem idioma informado</option>' : '');

  const ordem = ['4K','1080p','720p','SD','Outros'];
  const quals = ordem.filter(q => dados.some(d => d.quality === q));
  qualSel.innerHTML = '<option value="">Qualidade: todas</option>' +
    quals.map(q => `<option value="${q}">${q}</option>`).join('');

  if ([...idiomaSel.options].some(o => o.value === idiomaAtual)) idiomaSel.value = idiomaAtual;
  if ([...qualSel.options].some(o => o.value === qualAtual)) qualSel.value = qualAtual;

  document.getElementById('filterRow').style.display = (idiomas.length || quals.length > 1) ? 'flex' : 'none';
}

function renderStreamList(){
  const list = document.getElementById('streamList');
  const dados = window.__streamsMeta || [];
  const filtroIdioma = document.getElementById('filtroIdioma').value;
  const filtroQualidade = document.getElementById('filtroQualidade').value;

  const filtrados = dados.filter(d => {
    if (filtroQualidade && d.quality !== filtroQualidade) return false;
    if (filtroIdioma === '__none__' && d.meta.idioma) return false;
    if (filtroIdioma && filtroIdioma !== '__none__' && !idiomaTokens(d.meta.idioma).some(t => t.toLowerCase() === filtroIdioma.toLowerCase())) return false;
    return true;
  });

  if (!filtrados.length){ list.innerHTML = '<div class="status-msg">Nenhum resultado com esse filtro.</div>'; return; }

  const grupos = {};
  filtrados.forEach(d => { (grupos[d.quality] = grupos[d.quality] || []).push(d); });
  const ordem = ['4K','1080p','720p','SD','Outros'];

  list.innerHTML = ordem.filter(q => grupos[q]).map(q => {
    const linhas = grupos[q].map(({s, meta}) => {
      const pronto = !!s.url;
      const nome = (meta.filename || '').replace(/</g,'&lt;');
      let magnetLink = '';
      if (s.infoHash){
        const trackers = (s.sources||[]).filter(t=>t.startsWith('tracker:')).map(t=>`&tr=${encodeURIComponent(t.replace('tracker:',''))}`).join('');
        magnetLink = `magnet:?xt=urn:btih:${s.infoHash}${trackers}`;
      }
      const dlHref = pronto ? s.url : magnetLink;
      const copyTexto = pronto ? (s.url || '') : magnetLink;
      return `<div class="stream-row">
        <div class="stream-main">
          <div class="meta-pills">
            ${meta.provider ? `<span class="mp src">${meta.provider}</span>` : ''}
            ${meta.cached ? `<span class="mp cached">⚡ cache</span>` : ''}
            ${meta.sizeGB ? `<span class="mp">${meta.sizeGB}</span>` : ''}
            ${meta.idioma ? `<span class="mp peers">🌎 ${meta.idioma}</span>` : ''}
            ${meta.fonte ? `<span class="mp">${meta.fonte}</span>` : ''}
            ${meta.codec ? `<span class="mp">${meta.codec}</span>` : ''}
            ${meta.hdr ? `<span class="mp">${meta.hdr}</span>` : ''}
            ${(meta.audio || meta.canais) ? `<span class="mp">${[meta.audio, meta.canais].filter(Boolean).join(' ')}</span>` : ''}
            ${meta.grupo ? `<span class="mp">${meta.grupo}</span>` : ''}
          </div>
          <div class="stream-name">${nome}</div>
        </div>
        <div class="icon-actions">
          ${copyTexto ? `<button class="icon-btn" onclick="copiarTexto('${copyTexto.replace(/'/g,"\\'")}', '${pronto ? 'link' : 'magnet'}')" title="Copiar">${ICON_COPY}</button>` : ''}
          ${dlHref ? `<a class="icon-btn dl" href="${dlHref}" target="_blank" rel="noopener" title="Baixar">${ICON_DOWNLOAD}</a>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div>
      <div class="qgroup-head"><span class="qtag ${qClass(q)}">${q}</span> ${grupos[q].length} opç${grupos[q].length===1?'ão':'ões'}</div>
      ${linhas}
    </div>`;
  }).join('');
}

function copiarTexto(texto, tipo){
  function viaExecCommand(){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  const label = tipo === 'magnet' ? 'Magnet copiado' : 'Link copiado';
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(() => toast(label)).catch(() => toast(viaExecCommand() ? label : 'Não foi possível copiar'));
  } else {
    toast(viaExecCommand() ? label : 'Copie manualmente: precisa de HTTPS pra copiar automático');
  }
}
sortearSugestoes();
</script>
